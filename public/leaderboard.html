<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topplista - MusicPairing 🏆</title>
    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* Flexbox-layout som anpassar sig efter skärmstorlek */
        .main-layout {
            display: flex;
            flex-direction: column; /* Staplas vertikalt på små skärmar */
            gap: 25px;
            max-width: 900px;
            width: 100%;
            margin-top: 15px;
        }

        .leaderboard-section {
            flex: 1.5; /* Tar upp lite mer plats än QR-koden */
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            box-sizing: border-box;
        }

        .qr-section {
            flex: 1;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        h1, h2 { color: #38bdf8; margin-top: 0; }
        h1 { font-size: 2rem; margin-bottom: 20px; }
        h2 { font-size: 1.5rem; margin-bottom: 10px; }
        p.qr-text { color: #94a3b8; font-size: 0.95rem; margin-bottom: 15px; }

        /* QR-kodens behållare och bildinställningar */
        .qr-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }
        .qr-container img {
            display: block;
            width: 200px;  /* Perfekt storlek för skanning */
            height: 200px;
            object-fit: contain;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #334155; color: #38bdf8; font-weight: bold; }
        tr:last-child td { border-bottom: none; }
        
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover { background-color: #0284c7; }

        /* Sida-vid-sida layout för surfplattor, TV-apparater och datorskärmar */
        @media (min-width: 768px) {
            body { padding: 30px 20px; }
            .main-layout { flex-direction: row; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- VÄNSTER/ÖVRE DEL: TOPPLISTAN -->
        <div class="leaderboard-section">
            <h1>🏆 Topplista</h1>
            <table>
                <thead>
                    <tr>
                        <th>Plats</th>
                        <th>Namn</th>
                        <th>Antal Rätt</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Laddas dynamiskt med JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- HÖGER/NEDRE DEL: QR-KOD -->
        <div class="qr-section">
            <h2>Skanna & Spela!</h2>
            <p class="qr-text">Vill du utmana topplistan? Skanna koden med din mobil för att starta direkt!</p>
            <div class="qr-container">
                <!-- Laddar din bild qrcode.png från samma mapp -->
                <img src="/qrcode.png" alt="Skanna för att spela spelet">
            </div>
        </div>

    </div>

    <script>
        async function fetchLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8;">Inga spelare registrerade än!</td></tr>`;
                    return;
                }

                data.forEach((entry, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>#${index + 1}</strong></td>
                        <td>${entry.name}</td>
                        <td>${entry.score}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Kunde inte hämta topplistan:", err);
            }
        }

        // Initiera och starta autorefresh var 5:e sekund
        fetchLeaderboard();
        setInterval(fetchLeaderboard, 5000);
    </script>
</body>
</html>
