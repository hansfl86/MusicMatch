<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicPairing 🎵</title>
    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            box-sizing: border-box;
            margin-top: 10px;
        }
        h1 { color: #38bdf8; margin: 0 0 5px 0; }
        p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        
        input[type="text"] {
            padding: 14px;
            font-size: 1.1rem;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            width: 90%;
            margin-bottom: 15px;
            text-align: center;
            box-sizing: border-box;
        }
        button.action-btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 90%;
            box-sizing: border-box;
        }
        
        .score-counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        
        /* Den aktuella låten i fokus */
        .song-display {
            background: #0f172a;
            padding: 25px 15px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            border: 2px solid #1e293b;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            word-wrap: break-word;
        }
        .song-label {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 5px;
        }

        /* Knapparna för de 8 artisterna */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 kolumner sida vid sida på alla skärmar */
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .option-btn {
            background: #334155;
            border: 2px solid #475569;
            color: white;
            padding: 16px 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
        }
        .option-btn:active {
            transform: scale(0.97);
        }
        
        /* Feedback-klasser vid klick */
        .option-btn.correct { background-color: #10b981 !important; border-color: #34d399 !important; }
        .option-btn.wrong { background-color: #f43f5e !important; border-color: #f87171 !important; opacity: 0.6; }
        .disabled { pointer-events: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MusicPairing 🎵</h1>
        <p class="subtitle">Vem diggar låten? Välj rätt artist bland alternativen!</p>

        <!-- STEG 1: START -->
        <div id="start-screen">
            <input type="text" id="player-name" placeholder="Ditt artistnamn..." maxlength="15"><br>
            <button class="action-btn" onclick="requestStart()">Starta Quizet</button>
        </div>

        <!-- STEG 2: SPELSKÄRM -->
        <div id="game-screen" class="hidden">
            <div class="score-counter">
                <span>Fråga: <span id="current-question-num">1</span> / <span id="total-questions-num">10</span></span>
                <span>Poäng: <span id="current-score">0</span></span>
            </div>
            
            <div class="song-display">
                <div class="song-label">Aktuell Låt</div>
                <div id="song-text">Laddar...</div>
            </div>

            <div class="options-grid" id="options-container">
                <!-- 8 knappar genereras här -->
            </div>
        </div>

        <!-- STEG 3: VINST
        <div id="win-screen" class="hidden">
            <h2>Giget är slut! 🌟</h2>
            <p style="font-size: 1.25rem;">Riktigt bra kört! Din slutgiltiga poäng blev:</p>
            <h1 style="font-size: 3rem; color: #10b981; margin: 10px 0;"><span id="final-score">0</span></h1>
            <button class="action-btn" onclick="window.location.href='/leaderboard'">Visa Topplistan 🏆</button>
        </div> -->
        <!-- STEG 3: VINST- OCH TACKSKÄRM -->
        <div id="win-screen" class="hidden">
            <div class="thank-you-icon">❤️🎸</div>
            <h2>Spelet är slut, <span id="thank-you-name" style="color: #38bdf8;">Spelare</span>!</h2>
            <p style="font-size: 1.15rem; color: #94a3b8; margin-bottom: 5px;">Tack för att du var med och spelade!</p>
            <p style="font-size: 1.25rem; margin-top: 5px;">Din slutgiltiga poäng blev:</p>
            
            <h1 style="font-size: 3.5rem; color: #10b981; margin: 15px 0;"><span id="final-score">0</span></h1>
            
            <!-- Navigeringsknappar
            <button class="action-btn" onclick="window.location.href='/leaderboard'">Visa Topplistan 🏆</button>
            <button class="action-btn" onclick="resetToStart()" style="background-color: #475569;">Spela Igen 🔄</button>
            -->
        </div>
    </div>

    <script>
        let playerName = "";
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        async function requestStart() {
            const input = document.getElementById('player-name').value.trim();
            if (!input) return;
            playerName = input;

            try {
                const wordsRes = await fetch('/api/words');
                const data = await wordsRes.json();
                
                questions = data.questions;
                currentQuestionIndex = 0;
                score = 0;

                document.getElementById('total-questions-num').innerText = questions.length;
                
                showQuestion();

                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
            } catch (err) { console.error("Kunde inte starta spelet:", err); }
        }

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            
            // Uppdatera räknare och låttext
            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            document.getElementById('current-score').innerText = score;
            document.getElementById('song-text').innerText = `"${currentQuestion.song}"`;

            // Rendera de 8 knapparna
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            currentQuestion.options.forEach(artist => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = artist;
                
                btn.onclick = () => handleAnswer(btn, artist, currentQuestion.correct_artist);
                
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedBtn, selectedArtist, correctArtist) {
            const container = document.getElementById('options-container');
            
            // Lås alla knappar omedelbart så man inte kan klicka flera gånger
            const buttons = container.getElementsByClassName('option-btn');
            for (let btn of buttons) {
                btn.classList.add('disabled');
            }

            if (selectedArtist === correctArtist) {
                // RÄTT SVAR: Lys grönt!
                selectedBtn.classList.add('correct');
                score++;
                document.getElementById('current-score').innerText = score;
            } else {
                // FEL SVAR: Lys rött på den valda, och visa den rätta i grönt
                selectedBtn.classList.add('wrong');
                
                for (let btn of buttons) {
                    if (btn.innerText === correctArtist) {
                        btn.classList.add('correct');
                    }
                }
            }

            // Vänta 1.2 sekunder så spelaren hinner se resultatet, gå sedan vidare
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    showQuestion();
                } else {
                    submitFinalGame();
                }
            }, 1200);
        }

        async function submitFinalGame() {
            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: playerName, score: score })
                });

                if (res.ok) {
                    document.getElementById('game-screen').classList.add('hidden');
                    document.getElementById('win-screen').classList.remove('hidden');
                    
                    // Skriv ut tack-namnet och slutpoängen dynamiskt
                    document.getElementById('thank-you-name').innerText = playerName;
                    document.getElementById('final-score').innerText = `${score}`;
                }
            } catch (err) {
                console.error("Kunde inte skicka poäng:", err);
            }
        }
    </script>
</body>
</html>
