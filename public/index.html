<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicPairing 🎵</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { color: #94a3b8; margin-bottom: 25px; }
        
        input[type="text"] {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            width: 70%;
            margin-bottom: 15px;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0284c7; }
        
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 25px 0;
            text-align: left;
        }
        .column-title {
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 10px;
            text-align: center;
        }
        .item-box {
            background: #334155;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .static-box { background: #1e293b; border: 1px dashed #475569; }
        
        .nav-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 0.9rem;
            border-radius: 4px;
            margin-left: 5px;
            cursor: pointer;
        }
        .nav-btn:hover { background: #64748b; }
        
        #leaderboard {
            margin-top: 40px;
            width: 100%;
            max-width: 450px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #334155; color: #38bdf8; }
        .hidden { display: none !important; }
        .error-msg { color: #f43f5e; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MusicPairing 🎵</h1>
        <p class="subtitle">Koppla ihop artisten till vänster med rätt låt till höger!</p>

        <!-- STAGE 1: START SCREEN -->
        <div id="start-screen">
            <input type="text" id="player-name" placeholder="Skriv ditt artistnamn..." maxlength="15"><br>
            <button onclick="requestStart()">Starta Spelet</button>
            <div id="start-error" class="error-msg"></div>
        </div>

        <!-- STAGE 2: SPLAY SCREEN -->
        <div id="game-screen" class="hidden">
            <div class="game-layout">
                <div>
                    <div class="column-title">Artister (Fasta)</div>
                    <div id="left-list"></div>
                </div>
                <div>
                    <div class="column-title">Låtar (Sortera med pilarna)</div>
                    <div id="right-list"></div>
                </div>
            </div>
            <button onclick="submitAnswers()">Skicka in och stoppa tiden!</button>
            <div id="game-error" class="error-msg"></div>
        </div>

        <!-- STEG 3: VINSTSKÄRM -->
        <div id="win-screen" class="hidden">
            <h2>Snyggt gig! 🌟</h2>
            <p>Du klarade alla par på <strong id="final-time">0.0</strong> sekunder.</p>
            <button onclick="resetToStart()">Spela Igen</button>
        </div>
    </div>

    <!-- TOPPLISTA -->
    <div id="leaderboard">
        <h3>🏆 Topplistans Bästa Tider</h3>
        <table>
            <thead>
                <tr>
                    <th>Plats</th>
                    <th>Namn</th>
                    <th>Tid</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>

    <script>
        let playerName = "";
        let leftWords = [];
        let rightWords = [];

        // Läs in topplistan direkt vid start
        updateLeaderboard();

        async function requestStart() {
            const input = document.getElementById('player-name').value.trim();
            if (!input) {
                document.getElementById('start-error').innerText = "Du måste ange ett namn för att spela!";
                return;
            }
            playerName = input;

            try {
                const res = await fetch('/api/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: playerName })
                });

                if (res.ok) {
                    const wordsRes = await fetch('/api/words');
                    const data = await wordsRes.json();
                    
                    leftWords = data.left;
                    // Shuffle the right list
                    rightWords = data.right.sort(() => Math.random() - 0.5);

                    renderLists();
                    
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('game-screen').classList.remove('hidden');
                } else {
                    const errData = await res.json();
                    document.getElementById('start-error').innerText = errData.detail;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderLists() {
            const leftContainer = document.getElementById('left-list');
            const rightContainer = document.getElementById('right-list');
            
            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';

            // Rendera static left-words
            leftWords.forEach(word => {
                const box = document.createElement('div');
                box.className = 'item-box static-box';
                box.innerText = word;
                leftContainer.appendChild(box);
            });

            // Rendera dynamic right-word
            rightWords.forEach((word, index) => {
                const box = document.createElement('div');
                box.className = 'item-box';
                
                const textSpan = document.createElement('span');
                textSpan.innerText = word;
                box.appendChild(textSpan);

                const btnWrapper = document.createElement('div');

                const upBtn = document.createElement('button');
                upBtn.className = 'nav-btn';
                upBtn.innerText = 'Upp';
                upBtn.onclick = () => moveItem(index, -1);
                btnWrapper.appendChild(upBtn);

                const downBtn = document.createElement('button');
                downBtn.className = 'nav-btn';
                downBtn.innerText = 'Ner';
                downBtn.onclick = () => moveItem(index, 1);
                btnWrapper.appendChild(downBtn);

                box.appendChild(btnWrapper);
                rightContainer.appendChild(box);
            });
        }

        function moveItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= rightWords.length) return;

            // Switch place on elements safetly
            const temp = rightWords[index];
            rightWords[index] = rightWords[newIndex];
            rightWords[newIndex] = temp;

            renderLists();
        }

        async function submitAnswers() {
            const answers = {};
            leftWords.forEach((leftWord, index) => {
                answers[leftWord] = rightWords[index];
            });

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: playerName, answers: answers })
                });

                const data = await res.json();

                if (res.ok) {
                    document.getElementById('game-screen').classList.add('hidden');
                    document.getElementById('win-screen').classList.remove('hidden');
                    document.getElementById('final-time').innerText = data.time;
                    document.getElementById('game-error').innerText = "";
                    updateLeaderboard();
                } else {
                    document.getElementById('game-error').innerText = data.detail || "Något blev fel, kontrollera dina par!";
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function updateLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';
                data.forEach((entry, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td><strong>#${index+1}</strong></td><td>${entry.name}</td><td>${entry.time}s</td>`;
                    tbody.appendChild(row);
                });
	        } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
